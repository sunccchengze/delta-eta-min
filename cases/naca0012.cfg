% ============================================================================
% S12′ · NACA0012 跨声速 Euler · 一阶基础版
% 工况：AGARD AR-303 系（M=0.8, α=1.25°），弦长=1，远场 20c×20c
% ----------------------------------------------------------------------------
% ⚠️ 本文件在沙箱里**没有**被真实求解器验证过（沙箱无 SU2，见 BLOCKERS.md #2）。
%    键名相对跟做手册做了 3 处规范化（v8.x 的实际键名），首跑若出
%    "invalid/unknown key" 警告，按下面 %NOTE 行回退并记进 BLOCKERS.md：
%      手册 CONV_NUM_METHOD= ROE   → CONV_NUM_METHOD_FLOW= ROE
%      手册 CONV_RESIDUEVAL= 10    → CONV_RESIDUAL_MINVAL= -10（负数=量级，不是倍数）
%      手册 CONV_FIELD= RESIDUAL   → CONV_FIELD= RMS_DENSITY
%    MESH_FILENAME 由 tools/run_levels.py 按档位改写，这里写 L1 只是占位。
% ============================================================================

% ---- 求解器与网格 ----
SOLVER= EULER
MESH_FILENAME= mesh_L1.su2
MESH_FORMAT= SU2

% ---- 来流 ----
MACH_NUMBER= 0.8
AOA= 1.25
SIDESLIP_ANGLE= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
REYNOLDS_NUMBER= 1E6
GAS_CONSTANT= 287.260
SPECIFIC_HEAT_RATIO= 1.4

% ---- 力系数归一（弦长=1，单位展向）----
REF_LENGTH= 1.0
REF_AREA= 1.0

% ---- 边界（与 .geo 物理组 / .su2 MARKER_TAG 逐字一致）----
MARKER_EULER= ( Airfoil )
MARKER_FAR= ( Farfield )

% ---- 数值格式：一阶 ----
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 4.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

% ---- 步数与收敛判据 ----
ITER= 1000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10

% ---- 输出：history.csv 含残差与升阻力系数 ----
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
OUTPUT_FORMAT= CSV
RESTART_SOL= NO
