% ============================================================================
% S16′ · 二阶深收敛（细档 L3 整夜跑）——与 naca0012.cfg 只差 5 行（+ 步数）
%   MUSCL_FLOW= YES / SLOPE_LIMITER_FLOW= VENKATAKISHNAN / VENKAT_LIMITER_COEFF= 0.05
%   CFL_NUMBER= 1.5 / ITER= 3000
% 判据：残差降 ≥4 个量级；跑成即在 LEDGER 标 🏁（第一个个人 E4）。
% 卡壳：震荡不收敛 → VENKAT_LIMITER_COEFF= 0.02 收紧限制器；再不行 CFL 1.5 → 0.8。
% %NOTE SLOPE_LIMITER_FLOW 的取值在部分 v8.x 里叫 VENKATAKISHNAN，个别构建写
%       LIMITER_FLOW= YES + 单独键；首跑报无效时按 SU2_CFD 打印的提示改，并记 BLOCKERS.md。
% ============================================================================

SOLVER= EULER
MESH_FILENAME= mesh_L3.su2
MESH_FORMAT= SU2

MACH_NUMBER= 0.8
AOA= 1.25
SIDESLIP_ANGLE= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15
FREESTREAM_PRESSURE= 101325.0
REYNOLDS_NUMBER= 1E6
GAS_CONSTANT= 287.260
SPECIFIC_HEAT_RATIO= 1.4

REF_LENGTH= 1.0
REF_AREA= 1.0

MARKER_EULER= ( Airfoil )
MARKER_FAR= ( Farfield )

NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1.5
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

ITER= 3000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10

HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
OUTPUT_FORMAT= CSV
RESTART_SOL= NO
